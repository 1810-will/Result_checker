<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Result Checker</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
      }

      .container {
        width: min(90%, 480px);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 30px 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 24px;
        text-align: center;
        color: #f8fafc;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: #0f172a;
        color: #f8fafc;
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid #60a5fa;
        border-color: transparent;
      }

      button {
        border: none;
        border-radius: 10px;
        background: #22c55e;
        color: #06210f;
        font-weight: 700;
        padding: 12px 16px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .message {
        margin-top: 18px;
        min-height: 24px;
        font-size: 0.95rem;
        color: #fca5a5;
      }

      .result-card {
        display: none;
        margin-top: 24px;
        padding: 18px;
        border-radius: 12px;
        background: #111827;
        border: 1px solid #334155;
      }

      .result-card.visible {
        display: block;
      }

      .result-card h2 {
        margin-top: 0;
        color: #f8fafc;
      }

      .result-row {
        margin: 8px 0;
        color: #cbd5e1;
      }

      .result-row strong {
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Student Result Checker</h1>

      <form id="resultForm">
        <div>
          <label for="studentName">Student Name</label>
          <input type="text" id="studentName" placeholder="Enter student name" />
        </div>

        <div>
          <label for="score">Score</label>
          <input type="number" id="score" min="0" max="100" placeholder="Enter score" />
        </div>

        <button type="submit">Check Result</button>

      </form>


      <div id="message" class="message" aria-live="polite"></div>

      <div id="resultCard" class="result-card" aria-live="polite">
        <h2>Result</h2>
        <p class="result-row"><strong>Name:</strong> <span id="resultName"></span></p>
        <p class="result-row"><strong>Score:</strong> <span id="resultScore"></span></p>
        <p class="result-row"><strong>Grade:</strong> <span id="resultGrade"></span></p>
        <p class="result-row"><strong>Remark:</strong> <span id="resultRemark"></span></p>
      <button type="exit" id="exitBtn">Exit</button>

      </div>

    </div>

    <script>
      const form = document.getElementById('resultForm');
      const studentNameInput = document.getElementById('studentName');
      const scoreInput = document.getElementById('score');
      const messageBox = document.getElementById('message');
      const resultCard = document.getElementById('resultCard');
      const resultName = document.getElementById('resultName');
      const resultScore = document.getElementById('resultScore');
      const resultGrade = document.getElementById('resultGrade');
      const resultRemark = document.getElementById('resultRemark');
      const exitBtn = document.getElementById('exitBtn');

      function getGradeDetails(score) {
        if (score < 0 || score > 100) {
          return {
            valid: false,
            message: 'Score must be between 0 and 100.'
          };
        }

        if (score >= 90) {
          return { valid: true, grade: 'A', remark: 'Excellent' };
        }

        if (score >= 80) {
          return { valid: true, grade: 'B', remark: 'Very Good' };
        }

        if (score >= 70) {
          return { valid: true, grade: 'C', remark: 'Good' };
        }

        if (score >= 60) {
          return { valid: true, grade: 'D', remark: 'Fair' };
        }

        if (score >= 40) {
          return { valid: true, grade: 'E', remark: 'Pass' };
        }

        return { valid: true, grade: 'F', remark: 'Fail' };
      }

      function showError(message) {
        messageBox.textContent = message;
        messageBox.style.color = '#fca5a5';
        // resultCard.classList.remove('visible');
      }

      function showResult(name, score, grade, remark) {
        resultName.textContent = name;
        resultScore.textContent = score;
        resultGrade.textContent = grade;
        resultRemark.textContent = remark;
        resultCard.classList.add('visible');
        messageBox.textContent = '';
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const name = studentNameInput.value.trim();
        const rawScore = scoreInput.value.trim();

        if (!name) {
          showError('Student name is required.');
          return;
        }

        if (!rawScore) {
          showError('Please enter a score.');
          return;
        }

        const numericScore = Number(rawScore);

        if (Number.isNaN(numericScore)) {
          showError('Score must be a valid number.');
          return;
        }

        const result = getGradeDetails(numericScore);

        if (!result.valid) {
          showError(result.message);
          return;
        }
        showResult(name, numericScore, result.grade, result.remark);
      });

  exitBtn.addEventListener('click', function () {
  setTimeout(function () {
      resultForm.style.display = 'display';
      resultCard.classList.remove('visible');
     studentName.value = '';
     score.value = ''; 
     }, 200);
      });

    </script>
  </body>
</html>
